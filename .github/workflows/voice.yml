name: Voice
run-name: Voice ${{ inputs.episode }} (spare ElevenLabs key)

# Speaks an episode's script.txt with the SPARE ElevenLabs key (repository
# secret ELEVENLABS_SPARE_KEY) and commits voice.mp3 + alignment.json to the
# episode folder. The Reels studio starts it when this month's allowance on
# the main key (the one the Claude environment sends) is used up — see step 5
# of reels/PLAYBOOK.md.
on:
  workflow_dispatch:
    inputs:
      episode:
        description: Episode folder under reels/episodes (e.g. 008-some-topic)
        required: true
        type: string
      model:
        description: ElevenLabs model (eleven_v4, or eleven_v3 for [emotion] tags)
        type: string
        default: eleven_v4
      check_only:
        description: Only check the spare key and its monthly allowance (speaks nothing)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: voice-${{ inputs.episode }}
  cancel-in-progress: false

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_SPARE_KEY }}
      EPISODE: ${{ inputs.episode }}
      MODEL: ${{ inputs.model }}
      BRANCH: ${{ github.ref_name }}
      CHECK_ONLY: ${{ inputs.check_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Check the spare key only
        if: ${{ inputs.check_only }}
        run: |
          test -n "$ELEVENLABS_API_KEY" || { echo "The repository secret ELEVENLABS_SPARE_KEY is missing"; exit 1; }
          python3 - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request("https://api.elevenlabs.io/v1/user/subscription", headers={"xi-api-key": os.environ["ELEVENLABS_API_KEY"]})
          try:
              d = json.load(urllib.request.urlopen(req, timeout=30))
          except Exception as exc:
              raise SystemExit(f"The spare key did not work: {exc}")
          used, limit = d.get("character_count", 0), d.get("character_limit", 0)
          print(f"Spare key OK: tier {d.get('tier')}, {used}/{limit} characters used this month, resets {d.get('next_character_count_reset_unix')}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"Spare ElevenLabs key OK: {used}/{limit} characters used this month (tier {d.get('tier')})\n")
          PY

      - name: Check the episode and the key
        if: ${{ !inputs.check_only }}
        run: |
          case "$EPISODE" in */*|*..*|"") echo "Give the folder name only, e.g. 008-some-topic"; exit 1;; esac
          case "$MODEL" in eleven_v4|eleven_v3|eleven_multilingual_v2) ;; *) echo "Unknown model $MODEL"; exit 1;; esac
          test -f "reels/episodes/$EPISODE/script.txt" || { echo "No script at reels/episodes/$EPISODE"; exit 1; }
          test -n "$ELEVENLABS_API_KEY" || { echo "Add the repository secret ELEVENLABS_SPARE_KEY first"; exit 1; }

      - uses: actions/setup-python@v5
        if: ${{ !inputs.check_only }}
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: ${{ !inputs.check_only }}
        run: pip install -q -r requirements.txt

      - name: Speak
        if: ${{ !inputs.check_only }}
        run: python reels/tools/voice.py "reels/episodes/$EPISODE" --engine elevenlabs --model "$MODEL"

      - name: Commit the voice
        if: ${{ !inputs.check_only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "reels/episodes/$EPISODE/voice.mp3" "reels/episodes/$EPISODE/alignment.json"
          git commit -q -m "Voice for $EPISODE (spare ElevenLabs key)" || { echo "Nothing changed"; exit 0; }
          for i in 1 2 3 4; do
            git pull -q --rebase origin "$BRANCH" && git push -q origin "HEAD:$BRANCH" && exit 0
            sleep $((i * 5))
          done
          exit 1
