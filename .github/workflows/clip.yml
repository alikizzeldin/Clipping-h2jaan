name: Clip

on:
  schedule:
    # Every 3 hours. Scheduled runs do nothing until the repository variable
    # CLIPPER_ENABLED is set to "true".
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Render only, upload nothing (videos are attached to the run)
        type: boolean
        default: true
      profile:
        description: Game profile (blank = CLIPPER_PROFILE variable, then config.yaml)
        type: string
        default: ""
      limit:
        description: Clips this run (blank = config.yaml)
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: clip
  cancel-in-progress: false

jobs:
  clip:
    if: github.event_name == 'workflow_dispatch' || vars.CLIPPER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLIPPER_PROFILE: ${{ inputs.profile || vars.CLIPPER_PROFILE }}
      CLIPPER_PRIVACY: ${{ vars.CLIPPER_PRIVACY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Find, render and publish clips
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          python -m clipper run "${args[@]}"

      - name: Attach rendered videos (dry runs)
        if: always() && hashFiles('out/*.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rendered-clips
          path: out/*.mp4
          retention-days: 3

      - name: Save publish history
        if: always()
        run: |
          if [ -n "$(git status --porcelain state)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state
            git commit -m "Record published clips"
            git pull --rebase
            git push
          fi
