# Which game to clip: gta6 or valorant (the CLIPPER_PROFILE repository variable
# overrides this).
profile: gta6

profiles:
  valorant:
    kick_category: valorant        # the slug in kick.com/category/<slug>
    label: Valorant                # how the game is written in titles
    hashtags: [valorant, valorantclips, kick]
    min_views: 20                  # Valorant is small on Kick; keep the bar low
    theme: valorant
  gta6:
    kick_category: grand-theft-auto-vi
    label: GTA 6
    hashtags: [gta6, gtavi, gta6clips, kick]
    min_views: 150
    theme: gta6

# The look of the vertical frame, one per game. `background` is a 1080x1920
# image you can replace with your own; the gameplay window is cut out of it.
themes:
  gta6:
    background: assets/themes/gta6.png   # the GTA6FIED frame
    window_top: 404                  # the gameplay sits near the top of the frame's dark panel
    window_inset: 54
    caption_floor: 1500              # captions stay inside the panel, above the footer art
    radius: 10
    border_width: 3
    border: ["#FF2FD0", "#8A3CFF"]   # window border, left to right
    glow: "#FF2FD0"                  # glow around the window, and the neon captions
    highlight: "#35F2FF"             # the caption word being spoken
    outline: "#170636"
    caption_style: neon              # glowing neon-sign captions
    caption_glow: 0.3                # how strong the light behind the letters is (0 to 1)
    show_label: false                # the frame already carries the logo
    show_title: false
  valorant:
    background: assets/themes/valorant.png
    border: ["#FF4655", "#ECE8E1"]
    glow: ""
    highlight: "#FF4655"
    outline: "#0F1923"

selection:
  window: day                # Kick's "top clips" window: day | week | month | all
  max_age_hours: 36
  min_duration: 8
  max_duration: 120
  allow_mature: false
  max_per_channel: 1         # per run
  top_live_channels: 10      # how many of the biggest channels to follow
  top_channels_only: true    # use clips only from the biggest channels (most live viewers
                             # now, or most followers) and the featured ones
  featured_channels: [sxb]   # favourites: always followed, with their own daily slots
  featured_min_views: 20     # featured clips need only this many views
  languages: []              # e.g. [English, Arabic]; empty = any language
  drop_unknown_language: false
  allow_channels: []         # if not empty, ONLY these channels (and featured ones) are clipped
  block_channels: []         # channels never to clip
  require_gameplay: true     # skip clips where no game is on screen (e.g. the streamer chatting)
  own_clips: true            # for featured channels, also cut highlights from their streams:
                             # moments where the chat suddenly speeds up

render:
  layout: shorts             # shorts (1080x1920) | landscape (1920x1080)
  zoom: 1.0                  # 1.0 shows the whole picture; higher enlarges it and crops the sides
  show_label: true           # the game name above the gameplay
  overlay_title: true        # the clip's title under the game name

# Captions of what the streamer says, transcribed with Whisper. The language
# is detected per clip; Arabic and English are both drawn correctly.
captions:
  enabled: true
  model: large-v3-turbo      # best for Arabic. Faster, less accurate: medium, small
  language: auto             # or force one, e.g. ar
  max_words: 3               # words on screen at once
  max_chars: 14
  size: 150
  english_subtitles: true    # an English line under captions in another language
  translate_model: medium    # the Whisper model that does that translation

publish:
  via: buffer                # buffer (your Buffer account posts it) | youtube (own Google API project)
  buffer_channel_id: "6afc5738ece6dfde5ff77cea"   # "gta6fied clips" (YouTube) in Buffer
  buffer_organization_id: "6afc570c4663bcc9aa9f5992"   # used to read view counts once a day
  # Nothing is published before this moment, and only clips made after it are
  # used. 13:00 on 18 Nov in Palestine is midnight 19 Nov in New Zealand, the
  # first place GTA 6 unlocks.
  start_at: "2026-11-18T13:00:00+02:00"
  privacy: public            # private | unlisted | public
  max_per_run: 1             # the schedule checks every 2 hours
  max_per_day: 3             # clips per 24 hours
  featured_per_day: 2        # ...of which this many are reserved for featured_channels
  min_gap_hours: 7           # spread them out: at least this long between two posts
  fill_after_hours: 12       # a reserved slot opens to anyone after this long with no post
  title_template: "{title} | {streamer} {game}"
  fallback_title_template: "{streamer} {game} clip"   # used when the clip title is junk
  description_footer: ""     # e.g. a contact line for removal requests
